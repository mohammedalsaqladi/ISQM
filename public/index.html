<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة الجودة ISQM 1</title>
<style>
:root{
  --ink:#12222E;--ink-2:#223D4B;--paper:#F4F6F5;--panel:#fff;--line:#E3E8E7;--line-2:#CBD5D3;
  --teal:#0E7C6B;--teal-soft:#E6F2EF;--muted:#6B8089;
  --high:#B3261E;--high-bg:#FBEAE8;--med:#B26A08;--med-bg:#FDF1E1;--low:#2E7D50;--low-bg:#E7F3EC;
  --violet:#5B4B9E;--violet-bg:#EFEBFA;--r:8px;--sh:0 1px 2px rgba(18,34,46,.05),0 6px 18px -12px rgba(18,34,46,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-size:12.5px;line-height:1.55;
  font-family:"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body[dir="ltr"]{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* login */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1fr .8fr;z-index:50;background:var(--paper)}
.login-art{background:var(--ink);color:#EAF1F0;padding:38px 44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art:after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ink-2) 1px,transparent 1px),linear-gradient(90deg,var(--ink-2) 1px,transparent 1px);background-size:48px 48px;opacity:.3}
.login-art>*{position:relative;z-index:1}
.bcube{width:28px;height:28px;border:2px solid var(--teal);border-radius:7px;display:grid;place-items:center;color:#7FD8C6;font-weight:700;font-size:12px}
.login-art h1{font-size:25px;line-height:1.4;margin:0 0 10px;font-weight:600}
.login-art p{color:#9DB4B8;max-width:40ch;margin:0;font-size:12.5px}
.spine{display:flex;flex-direction:column;gap:7px;margin-top:26px}
.spine-row{display:flex;align-items:center;gap:11px;color:#B9CDCE;font-size:11.5px}
.spine-row b{color:#7FD8C6;min-width:22px}
.spine-bar{height:1px;flex:1;background:var(--ink-2)}
.login-form{display:grid;place-items:center;padding:26px}
.login-card{width:100%;max-width:320px}
.login-card h2{margin:0 0 4px;font-size:18px;font-weight:600}
.login-card .sub{color:var(--muted);margin:0 0 20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:#fff;outline:none;font-size:12.5px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.btn{border:1px solid transparent;border-radius:6px;padding:6px 12px;font-weight:600;background:var(--teal);color:#fff;font-size:12px}
.btn:hover{background:#0a6355}
.btn.block{width:100%;padding:9px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:#F1F4F3}
.btn.xs{padding:4px 9px;font-size:11.5px}
.hint{margin-top:14px;padding:9px 11px;background:#fff;border:1px dashed var(--line-2);border-radius:6px;font-size:11px;color:var(--muted)}
.err{color:var(--high);font-size:12px;margin-top:8px;display:none}

/* shell */
#app{display:none}
.shell{display:grid;grid-template-columns:auto 1fr;min-height:100vh}
.sidebar{order:-1;background:var(--ink);color:#C8D8DA;position:sticky;top:0;height:100vh;display:flex;flex-direction:row}
.sbmain{width:206px;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sbcomp{width:194px;height:100vh;overflow-y:auto;background:#0C1A23;border-left:1px solid var(--ink-2);border-right:1px solid var(--ink-2);display:none}
.sbcomp.show{display:block}
.comp-h{padding:13px 12px 6px;font-size:9.5px;color:#6E888D;letter-spacing:.8px;display:flex;align-items:center;justify-content:space-between}
.cadd{cursor:pointer;color:#8FA7AC;font-size:13px;font-weight:700;padding:0 4px}
.cadd:hover{color:#fff}
.cedit{cursor:pointer;color:#5C7379;font-size:10px;padding:0 3px;opacity:.7}
.cedit:hover{opacity:1;color:#fff}
.comp-item{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;margin:2px 7px;border-radius:6px;font-size:11.6px;line-height:1.35;color:#C8D8DA;cursor:pointer}
.comp-item:hover{background:#17303D;color:#fff}
.comp-item.active{background:var(--teal);color:#fff}
.comp-item .ci{font-size:9px;color:#6E888D;min-width:14px;padding-top:2px}
.comp-item.active .ci{color:#CDEFE7}
.comp-item .cn{font-size:9px;background:#1B3140;color:#8FA7AC;border-radius:99px;padding:0 6px;margin-inline-start:auto;align-self:center}
.comp-item.active .cn{background:rgba(255,255,255,.22);color:#fff}
.sb-head{padding:14px 14px;border-bottom:1px solid var(--ink-2)}
.sb-head .name{font-weight:600;color:#fff;font-size:12.8px;line-height:1.4}
.sb-head .sub{font-size:10px;color:#7E979B;letter-spacing:.5px}
.nav{padding:8px 8px;flex:1}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;color:#C8D8DA;font-size:12.2px;cursor:pointer;user-select:none}
.nav-item:hover{background:#1B3140;color:#fff}
.nav-item.active{background:var(--teal);color:#fff}
.nav-item .ico{width:14px;text-align:center;font-size:11px;opacity:.9}
.nav-lbl{font-size:9.5px;color:#6E888D;letter-spacing:.8px;padding:12px 10px 4px}
.nav-sub{margin:2px 0 2px;padding-inline-start:6px;border-inline-start:1px solid var(--ink-2);margin-inline-start:16px;display:none}
.nav-sub.open{display:block}
.nav-sub .nav-item{font-size:11.8px;padding:5px 8px;line-height:1.35}
.sub-idx{font-size:9px;color:#6E888D;min-width:14px}
.nav-item.active .sub-idx{color:#CDEFE7}
.chev{margin-inline-start:auto;font-size:8px;opacity:.7}
body[dir="rtl"] .chev{transform:rotate(180deg)}
.chev.open{transform:rotate(90deg)!important}
.sb-foot{padding:10px 14px;border-top:1px solid var(--ink-2);font-size:10.5px;color:#7E899B}

main{min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.crumb{color:var(--muted);font-size:10.5px}
.crumb b{color:var(--ink);font-size:13.5px;display:block;font-weight:600}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:7px}
.lang-toggle{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.lang-toggle button{background:#fff;border:0;padding:5px 9px;font-size:11px;font-weight:600;color:var(--muted)}
.lang-toggle button.on{background:var(--ink);color:#fff}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:11px}
.content{padding:16px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card-h h3{margin:0;font-size:12.5px;font-weight:600}
.card-h .side{margin-inline-start:auto;font-size:11px;color:var(--muted)}
.card-b{padding:13px}
.page-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:16px;font-weight:600}
.page-head p{margin:1px 0 0;color:var(--muted);font-size:11.5px}
.page-head .side{margin-inline-start:auto;display:flex;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--teal)}
.kpi.k2:before{background:var(--high)}.kpi.k3:before{background:var(--violet)}
.kpi.k4:before{background:var(--med)}.kpi.k5:before{background:var(--low)}
.kpi .lbl{font-size:10.5px;color:var(--muted)}
.kpi .val{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.5px}
.kpi .foot{font-size:10px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:12px;margin-bottom:12px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#EDF1F0}
.meter i{display:block}
.meter i.h{background:var(--high)}.meter i.m{background:var(--med)}.meter i.l{background:var(--low)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.h{background:var(--high)}.dot.m{background:var(--med)}.dot.l{background:var(--low)}
.dot.t{background:var(--teal)}.dot.v{background:var(--violet)}
.crow{display:grid;grid-template-columns:150px 1fr 36px;gap:9px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.crow:last-child{border-bottom:0}
.crow .cname{font-size:11.6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.crow .cname:hover{color:var(--teal)}
.crow .cnum{text-align:end;font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.b-h{background:var(--high-bg);color:var(--high)}.b-m{background:var(--med-bg);color:var(--med)}
.b-l{background:var(--low-bg);color:var(--low)}.b-n{background:#EEF1F1;color:var(--muted)}
.b-t{background:var(--teal-soft);color:var(--teal)}.b-v{background:var(--violet-bg);color:var(--violet)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 11px;min-width:78px}
.chip .k{font-size:10px;color:var(--muted)}
.chip .v{font-size:16px;font-weight:600}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.chipgrp{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 12px}
.cg-t{font-size:10px;color:var(--muted);margin-bottom:7px}
.cg-row{display:flex;gap:14px;flex-wrap:wrap}
.cg-i{display:flex;flex-direction:column;gap:1px}
.cg-i b{font-size:16px;font-weight:700;line-height:1.1}
.cg-i span{font-size:9.5px;color:var(--muted)}
.icobtn{width:26px;height:26px;display:inline-grid;place-items:center;padding:0;font-size:13px;border-radius:6px}
.tree-tools{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tree-tools .tsearch{flex:1;padding:0;border:0}
.tcount{font-size:9.5px;color:var(--muted);background:#F1F4F3;border-radius:99px;padding:0 6px;margin-inline-start:5px}
.qadd-menu{position:relative;display:inline-block}
.qadd-list{position:absolute;inset-inline-start:0;top:30px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:var(--sh);z-index:10;min-width:150px;display:none}
.qadd-list.open{display:block}
.qadd-list div{padding:8px 12px;font-size:12px;cursor:pointer}
.qadd-list div:hover{background:var(--teal-soft);color:var(--teal)}

/* tree */
.workspace{display:grid;grid-template-columns:330px 1fr;gap:12px;align-items:start}
.tree{max-height:calc(100vh - 190px);overflow:auto}
.tsearch{padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.tsearch input{width:100%;padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;outline:none;font-size:11.8px}
.tbody{padding:6px 8px 10px}
.trow{display:flex;align-items:flex-start;gap:5px;padding:4px 6px;border-radius:5px;cursor:pointer;line-height:1.4}
.tquick{flex-shrink:0;width:16px;height:16px;display:none;align-items:center;justify-content:center;border-radius:4px;background:var(--teal-soft);color:var(--teal);font-size:11px;font-weight:700;margin-top:1px}
.trow:hover .tquick{display:flex}
.tquick:hover{background:var(--teal);color:#fff}
.trow:hover{background:#F2F6F5}
.trow.sel{background:var(--teal-soft)}
.tcar{width:11px;text-align:center;font-size:7px;color:var(--muted);flex:0 0 11px;padding-top:4px}
body[dir="rtl"] .tcar span{display:inline-block;transform:rotate(180deg)}
.tcar span.open{transform:rotate(90deg)!important}
.tico{flex:0 0 20px;width:20px;text-align:center;font-size:16px;line-height:1.15;padding-top:1px}
.tmain{flex:1;min-width:0}
.tline{display:flex;align-items:center;gap:5px}
.tlbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.6px}
.trow.k-obj .tlbl{font-weight:600}
.tcode{font-size:9px;color:#94A6AB;flex:0 0 auto}
.tmeta{font-size:9.2px;color:#93A5AA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tgrp{font-size:10px;color:var(--ink);font-weight:700;padding:8px 6px 4px;margin-top:5px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
.tgrp:first-child{border-top:0;margin-top:0}
.tlegend{display:flex;gap:10px;flex-wrap:wrap;padding:6px 9px;border-bottom:1px solid var(--line);font-size:9.5px;color:var(--muted)}
.tlegend span{display:flex;align-items:center;gap:4px}
.tlegend b{font-size:14px;font-weight:400}
/* workspace tabs + chat */
.wtabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.wtab{padding:8px 12px;font-size:11.8px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:5px}
.wtab.on{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
.wtab .cnt{font-size:9.5px;background:#F1F4F3;border-radius:99px;padding:0 6px}
.chatwrap{display:flex;flex-direction:column;height:520px}
.chatscope{padding:7px 13px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#FAFBFB}
.msgs{flex:1;overflow-y:auto;padding:13px;background:#F6F8F7;display:flex;flex-direction:column;gap:8px}
.msg{max-width:74%;align-self:flex-start}
.msg.me{align-self:flex-end}
.bub{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;box-shadow:0 1px 1px rgba(18,34,46,.04)}
.msg.me .bub{background:#DFF3EE;border-color:#C6E7DF}
.msg-who{font-size:10px;font-weight:700;color:var(--teal);margin-bottom:2px}
.msg-txt{font-size:12.2px;line-height:1.6;white-space:pre-wrap}
.msg-foot{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:9.2px;color:var(--muted);flex-wrap:wrap}
.msg-tag{background:#EEF2F1;border-radius:99px;padding:1px 7px;font-size:9.2px;color:var(--ink-2);cursor:pointer}
.msg-tag:hover{background:#DDE6E4}
.relink{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.relink select{font-size:10.5px;padding:3px 5px;border:1px solid var(--line-2);border-radius:5px;background:#fff;max-width:150px}
.composer{display:flex;gap:6px;padding:9px;border-top:1px solid var(--line);background:#fff}
.composer input{flex:1;padding:8px 11px;border:1px solid var(--line-2);border-radius:99px;outline:none;font-size:12.2px}
.composer input:focus{border-color:var(--teal)}
.chatfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chatfilters select{padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;background:#fff;font-size:11.8px;min-width:150px}
.chatempty{margin:auto;color:var(--muted);font-size:11.5px;text-align:center}
.ubadge{background:var(--high);color:#fff;border-radius:99px;font-size:8.5px;font-weight:700;padding:0 5px;line-height:14px;display:inline-block;min-width:14px;text-align:center}
.unread-sep{align-self:center;background:#FBEAE8;color:var(--high);font-size:9.5px;font-weight:700;border-radius:99px;padding:2px 12px;margin:4px 0}
.msg.new .bub{border-color:#F2C6C1;box-shadow:0 0 0 2px rgba(179,38,30,.07)}
.nav-item .un{margin-inline-start:auto}
.tkids{margin-inline-start:12px;padding-inline-start:6px;border-inline-start:1px dashed var(--line)}
.tempty{padding:22px;text-align:center;color:var(--muted);font-size:11.5px}

/* detail */
.detail{min-height:440px}
.d-empty{display:grid;place-items:center;height:380px;color:var(--muted);text-align:center;padding:20px}
.d-empty .big{font-size:30px;opacity:.22;margin-bottom:6px}
.d-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.d-eyebrow{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.d-title{margin:0;font-size:15px;font-weight:600;line-height:1.45}
.d-desc{margin:7px 0 0;font-size:12.4px;line-height:1.65;color:#33454F}
.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.meta-c{padding:9px 16px;border-inline-end:1px solid var(--line)}
.meta-c:last-child{border-inline-end:0}
.meta-c .k{font-size:10px;color:var(--muted)}
.meta-c .v{font-size:12.2px;font-weight:600;margin-top:1px}
.d-body{padding:14px 16px}
.sec-t{display:flex;align-items:center;gap:8px;margin:0 0 9px}
.sec-t h4{margin:0;font-size:12px;font-weight:600}
.sec-t .cnt{font-size:10px;color:var(--muted);background:#F1F4F3;padding:1px 7px;border-radius:99px}
.sec-t .side{margin-inline-start:auto}
.item{border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:7px;background:#FCFDFD;cursor:pointer}
.item:hover{border-color:var(--line-2)}
.item-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item-ttl{font-weight:600;font-size:12.2px}
.item-txt{font-size:11.8px;color:#4A5C65;margin-top:3px;line-height:1.55}
.item-meta{display:flex;gap:13px;flex-wrap:wrap;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted)}
.item-meta b{color:var(--ink-2);font-weight:600}
.add-form{border:1px solid var(--line-2);border-radius:7px;padding:11px;background:#F8FAF9;margin-top:4px;display:none}
.add-form.open{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.tabs{display:flex;gap:2px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:var(--r);margin-bottom:12px}
.tab{padding:8px 11px;font-size:11.8px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:var(--muted);text-align:start;font-weight:600;padding:7px 11px;border-bottom:1px solid var(--line);background:#FAFBFB}
td{padding:8px 11px;border-bottom:1px solid var(--line);font-size:11.8px}
tr:last-child td{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:11.8px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:end}
.profile-grid{display:grid;grid-template-columns:250px 1fr;gap:12px}
.big-avatar{width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:600;margin:0 auto 9px}
.print-head{display:none}
@media print{
  .sidebar,.topbar,.no-print,.tsearch,.add-form,.tabs{display:none!important}
  .shell{display:block}body{background:#fff}.content{padding:0}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}

/* ---------------- API ---------------- */
async function api(path,opts={}){
 const res=await fetch("/api"+path,{...opts,
  headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{}),...(opts.headers||{})}});
 if(res.status===401){TOKEN=null;localStorage.removeItem("isqm_token");throw new Error("unauthorized");}
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw new Error(data.error||"request_failed");
 return data;}

/* ---------------- backup: export / import ---------------- */
async function doExport(){
 try{
  const data=await api("/export");
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="isqm-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
 }catch(e){alert(e.message);}}

const TEMPLATE_SHEETS={
 "المكونات":["slug","seq","name_ar","name_en","desc_ar","desc_en"],

};
const SHEET_TO_KEY={"المكونات":"components","الأهداف":"objectives","المخاطر":"risks","الإجراءات":"responses","الاختبارات":"tests","النتائج":"results"};

function downloadTemplate(){
 if(typeof XLSX==="undefined"){alert(t("xlsxLoadError"));return;}
 const wb=XLSX.utils.book_new();
 const instr=[[t("tplInstrTitle")],[""],[t("tplInstr1")],[""],[t("tplInstr2")],[""],[t("tplInstr3")],[""],[t("tplInstr4")]];
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(instr),t("tplInstructionsSheet"));
 const refRows=[["type","code_or_slug","title"]];
 DATA.forEach(c=>refRows.push(["component",c.id,L(c)]));
 DATA.forEach(c=>walk(c,n=>refRows.push([kx(n),n.code,L(n.t)])));
 refRows.push(["",""," "]);
 USERS.forEach(u=>refRows.push(["username",u.username,L(u.name)]));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(refRows),t("tplRefSheet"));
 Object.entries(TEMPLATE_SHEETS).forEach(([name,cols])=>{
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([cols]),name);
 });
 XLSX.writeFile(wb,"isqm-import-template.xlsx");}

async function doImportExcel(file){
 const buf=await file.arrayBuffer();
 const wb=XLSX.read(buf,{type:"array"});
 const data={components:[],objectives:[],risks:[],responses:[],tests:[],results:[]};
 Object.entries(SHEET_TO_KEY).forEach(([sheetName,key])=>{
  const ws=wb.Sheets[sheetName];if(!ws)return;
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  data[key]=rows.filter(r=>Object.values(r).some(v=>v!==null&&String(v).trim()!==""));});
 data.components.forEach(c=>{c.seq=c.seq?Number(c.seq):null;});
 data.objectives.forEach(o=>{o.is_additional=["1","true","TRUE","نعم","yes","YES"].includes(String(o.is_additional));});
 data.risks.forEach(k=>{k.likelihood=k.likelihood?Number(k.likelihood):null;k.impact=k.impact?Number(k.impact):null;});
 return data;}

function pickImportFile(){const el=document.getElementById("imp-file");if(el)el.click();}
async function doImport(file){
 if(!file)return;
 if(!confirm(t("importConfirm")))return;
 try{
  const name=file.name.toLowerCase();
  let data;
  if(name.endsWith(".xlsx")||name.endsWith(".xls")){
   if(typeof XLSX==="undefined")throw new Error(t("xlsxLoadError"));
   data=await doImportExcel(file);
  }else{

function statsOf(c){const st={ob:0,rk:0,rs:0,ts:0,rx:0,h:0,m:0,l:0,late:0,done:0,inprog:0};

function bubbles(list){
 if(!list.length)return `<div class="chatempty">${t("noMsgs")}</div>`;
 const sorted=list.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const firstUnread=sorted.find(isUnread);
 return sorted.map(m=>{
  const mine=!!m.mine,c=compById(m.comp),nw=isUnread(m);
  const sep=(firstUnread&&m.id===firstUnread.id)?`<div class="unread-sep">${t("unreadSep")}</div>`:"";
  const relink=state.relink===m.id?`<div class="relink">
    <select data-rl-comp="${m.id}">${DATA.map(x=>`<option value="${x.id}" ${x.id===m.comp?"selected":""}>${esc(L(x))}</option>`).join("")}</select>
    <select data-rl-node="${m.id}"><option value="">${t("generalChat")}</option>${flatNodes(compById(m.comp)).map(n=>`<option value="${n.code}" ${n.code===m.code?"selected":""}>${ICON[kx(n)]} ${esc(L(n.t))}</option>`).join("")}</select>
    <button class="btn xs" data-rl-save="${m.id}">${t("apply")}</button></div>`:"";
  return sep+`<div class="msg ${mine?"me":""} ${nw?"new":""}"><div class="bub">
   ${mine?"":`<div class="msg-who">${esc(L(m.byName))}</div>`}
   <div class="msg-txt">${esc(m.txt)}</div>
   <div class="msg-foot">
    <span class="msg-tag" data-relink="${m.id}" title="${t("changeLink")}">${nodeIcon(m.comp,m.code)} ${esc(m.code?nodeTitle(m.comp,m.code):L(c))}${m.code?` · ${m.code}`:""}</span>
    <span class="mono num">${m.date} · ${m.time}</span>
   </div>${relink}</div></div>`;}).join("");}

   <div class="kv"><span class="k">${t("status")}</span><span class="v"><span class="badge b-l">${t("active")}</span></span></div></div></div></div>
 <div class="card"><div class="card-h"><h3>${t("assignedToMe")}</h3><span class="side">${mine.length}</span></div>
  <table><thead><tr><th>${t("ref")}</th><th>${t("risk")}</th><th>${t("component")}</th><th>${t("riskLevel")}</th><th>${t("responses")}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}

/* ---------------- render ---------------- */
function render(){
 const v=document.getElementById("view");
 const titles={home:t("home"),chat:t("chat"),company:t("company"),users:t("users"),profile:t("profile")};
 if(state.page==="quality"){
  document.getElementById("tb-path").textContent=t("quality");
  document.getElementById("tb-title").textContent=state.comp==="all"?t("allComp"):L(comps()[0]);
  v.innerHTML=viewQuality();
 }else{document.getElementById("tb-path").textContent=t("firm");
  document.getElementById("tb-title").textContent=titles[state.page];
  v.innerHTML=state.page==="home"?viewHome():state.page==="chat"?viewChat():state.page==="company"?viewCompany():state.page==="users"?viewUsers():viewProfile();}
 buildNav();bind();}

function bind(){
 const v=document.getElementById("view");
 v.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>{const id=el.dataset.goto;state.page="quality";state.comp=id;state.sel=null;
   state.open=new Set();comps().forEach(c=>c.objectives.forEach(o=>state.open.add(o.code)));render();});
 v.querySelectorAll("[data-car]").forEach(el=>el.onclick=e=>{e.stopPropagation();const k=el.dataset.car;
   state.open.has(k)?state.open.delete(k):state.open.add(k);render();});
 v.querySelectorAll("[data-node]").forEach(el=>el.onclick=e=>{e.stopPropagation();const k=el.dataset.node;
   state.sel=k;state.adding=false;state.relink=null;state.open.add(k);render();});
 v.querySelectorAll("[data-quick]").forEach(el=>el.onclick=e=>{e.stopPropagation();const k=el.dataset.quick;
   state.sel=k;state.wTab="details";state.adding=true;state.relink=null;state.open.add(k);render();});
 v.querySelectorAll("[data-wtab]").forEach(el=>el.onclick=()=>{state.wTab=el.dataset.wtab;state.relink=null;render();});
 v.querySelectorAll("[data-relink]").forEach(el=>el.onclick=e=>{e.stopPropagation();const id=+el.dataset.relink;
   state.relink=state.relink===id?null:id;render();});
 v.querySelectorAll("[data-rl-comp]").forEach(el=>el.onchange=()=>{const m=CHAT.find(x=>x.id===+el.dataset.rlComp);
   m.comp=el.value;m.code=null;render();});
 v.querySelectorAll("[data-rl-save]").forEach(el=>el.onclick=async e=>{e.stopPropagation();const id=+el.dataset.rlSave;
   const m=CHAT.find(x=>x.id===id);const cs=v.querySelector(`[data-rl-comp="${id}"]`),ns=v.querySelector(`[data-rl-node="${id}"]`);
   const code=ns.value||null,ref=code?NODE_BY_CODE[code]:null;
   try{await api(`/chat/${id}/link`,{method:"PATCH",body:JSON.stringify(
     {compSlug:cs.value,itemKind:ref?KDB[kx(ref.node)]:null,itemId:ref?ref.node.dbId:null})});
    m.comp=cs.value;m.code=code;m.kind=ref?KDB[kx(ref.node)]:null;
   }catch(err){alert(err.message);}
   state.relink=null;render();});
 const cf=document.getElementById("cf-comp");
 if(cf)cf.onchange=()=>{state.cComp=cf.value;state.cNode="all";render();};
 const cfn=document.getElementById("cf-node");
 if(cfn)cfn.onchange=()=>{state.cNode=cfn.value;render();};
 const ci=document.getElementById("c-in"),cs=document.getElementById("c-send");
 if(ci){ci.oninput=()=>{state.draft=ci.value;};
  ci.onkeydown=e=>{if(e.key==="Enter")sendMsg();};}
 if(cs)cs.onclick=()=>sendMsg();
 const box=document.getElementById("msgs");
 if(box){box.scrollTop=box.scrollHeight;
  const pending=scopeMsgs().filter(isUnread);
  if(pending.length&&!state._reading){state._reading=true;
   setTimeout(()=>{markRead(pending);state._reading=false;render();},1500);}}
 const exp=document.getElementById("btn-exp");
 if(exp)exp.onclick=()=>{comps().forEach(c=>walk(c,n=>{if(n.kids.length)state.open.add(n.code);}));render();};
 const col=document.getElementById("btn-col");
 if(col)col.onclick=()=>{state.open=new Set();render();};
 const q=document.getElementById("q-search");
 if(q)q.oninput=()=>{state.q=q.value;const p=q.selectionStart;render();const n2=document.getElementById("q-search");if(n2){n2.focus();n2.setSelectionRange(p,p);}};
 const add=document.getElementById("btn-add");if(add)add.onclick=()=>{state.adding=!state.adding;render();};
 const cancel=document.getElementById("btn-cancel");if(cancel)cancel.onclick=()=>{state.adding=false;render();};
 const save=document.getElementById("btn-save");
 if(save)save.onclick=async()=>{
  const ttl=document.getElementById("f-ttl").value.trim(),txt=document.getElementById("f-text").value.trim();
  if(!ttl){document.getElementById("f-ttl").focus();return;}
  const c=ownerOf(state.sel);if(!c)return;const n=findNode(c,state.sel);if(!n)return;
  const am=ADD_META[kx(n)];if(!am)return;
  const payload={title:ttl,desc:txt||ttl,status:document.getElementById("f-st").value};
  payload[am.idField]=n.dbId;
  if(am.kind!=="res"){const toIdx=+document.getElementById("f-to").value;payload.assignedTo=USERS[toIdx]&&USERS[toIdx].id;}
  if(am.extra==="type")payload.type=document.getElementById("f-type").value;
  if(am.extra==="severity")payload.severity=document.getElementById("f-sev").value;
  try{
   await api(am.endpoint,{method:"POST",body:JSON.stringify(payload)});
   await loadAll();
  }catch(e){alert(e.message);}
  state.adding=false;render();}
 const addObj=document.getElementById("btn-add-obj");
 if(addObj)addObj.onclick=()=>{state.addingObjective=!state.addingObjective;render();};
 const cancelObj=document.getElementById("btn-cancel-obj");
 if(cancelObj)cancelObj.onclick=()=>{state.addingObjective=false;render();};
 const saveObj=document.getElementById("btn-save-obj");
 if(saveObj)saveObj.onclick=async()=>{
  const ttl=document.getElementById("fo-ttl").value.trim(),txt=document.getElementById("fo-text").value.trim();
  if(!ttl){document.getElementById("fo-ttl").focus();return;}
  const list=comps();if(!list[0])return;
  const toIdx=+document.getElementById("fo-to").value;
  try{
   await api("/objectives",{method:"POST",body:JSON.stringify({componentId:list[0].dbId,title:ttl,desc:txt||ttl,
     standardRef:document.getElementById("fo-ref").value.trim(),ownerId:USERS[toIdx]&&USERS[toIdx].id})});
   await loadAll();
  }catch(e){alert(e.message);}
  state.addingObjective=false;render();};
 const addUser=document.getElementById("btn-add-user");
 if(addUser)addUser.onclick=()=>{state.addingUser=!state.addingUser;render();};
 const cancelNewUser=document.getElementById("btn-cancel-newuser");
 if(cancelNewUser)cancelNewUser.onclick=()=>{state.addingUser=false;render();};
 const saveNewUser=document.getElementById("btn-save-newuser");
 if(saveNewUser)saveNewUser.onclick=async()=>{
  const name=document.getElementById("nu-name").value.trim(),username=document.getElementById("nu-username").value.trim(),
    pass=document.getElementById("nu-pass").value;
  if(!name||!username||!pass){alert(t("reqFields"));return;}
  try{
   await api("/users",{method:"POST",body:JSON.stringify({fullName:name,username,password:pass,
     email:document.getElementById("nu-email").value.trim(),role:document.getElementById("nu-role").value})});
   await loadAll();state.addingUser=false;render();
  }catch(e){alert(e.message);}};
 v.querySelectorAll("[data-edit-user-btn]").forEach(el=>el.onclick=()=>{
   const id=el.dataset.editUserBtn;state.editingUserId=state.editingUserId===id?null:id;render();});
 const cancelUser=document.getElementById("btn-cancel-user");
 if(cancelUser)cancelUser.onclick=()=>{state.editingUserId=null;render();};
 const saveUser=document.getElementById("btn-save-user");
 if(saveUser)saveUser.onclick=async()=>{
  const uid=saveUser.dataset.uid;
  const pass=document.getElementById("eu-pass").value;
  try{
   await api("/users/"+uid,{method:"PATCH",body:JSON.stringify({
     fullName:document.getElementById("eu-name").value.trim(),
     email:document.getElementById("eu-email").value.trim(),
     role:document.getElementById("eu-role").value,
     isActive:document.getElementById("eu-active").value==="1",
     password:pass||undefined})});
   await loadAll();state.editingUserId=null;render();
  }catch(e){alert(e.message);}};
 const editFirm=document.getElementById("btn-edit-firm");
 if(editFirm)editFirm.onclick=()=>{state.editingFirm=!state.editingFirm;render();};
 const saveFirm=document.getElementById("btn-save-firm");
 if(saveFirm)saveFirm.onclick=async()=>{
  try{
   await api("/firm",{method:"PATCH",body:JSON.stringify({
     name:document.getElementById("ef-name").value.trim(),
     license:document.getElementById("ef-license").value.trim(),
     cr:document.getElementById("ef-cr").value.trim(),
     phone:document.getElementById("ef-phone").value.trim(),
     city:document.getElementById("ef-city").value.trim(),
     country:document.getElementById("ef-country").value.trim(),
     partners:+document.getElementById("ef-partners").value||0,
     staff:+document.getElementById("ef-staff").value||0,
     engagements:+document.getElementById("ef-engagements").value||0,
     scope:document.getElementById("ef-scope").value.trim()})});
   await loadAll();state.editingFirm=false;render();
  }catch(e){alert(e.message);}};}

async function sendMsg(){
 const inp=document.getElementById("c-in");if(!inp)return;
 const txt=inp.value.trim();if(!txt)return;
 let compId,code=null;
 if(state.page==="chat"){compId=state.cComp;code=state.cNode==="all"?null:state.cNode;if(compId==="all")return;}
 else{compId=state.comp==="all"?(state.sel?ownerOf(state.sel).id:null):state.comp;code=state.sel||null;if(!compId)return;}
 const ref=code?NODE_BY_CODE[code]:null;
 inp.value="";state.draft="";
 try{
  const r=await api("/chat",{method:"POST",body:JSON.stringify(
    {compSlug:compId,itemKind:ref?KDB[kx(ref.node)]:null,itemId:ref?ref.node.dbId:null,body:txt})});
  CHAT.push({id:r.id,by:ME,mine:true,byName:PEOPLE[ME],txt,comp:compId,code,
    kind:ref?KDB[kx(ref.node)]:null,unread:false,date:r.date,time:r.time});
 }catch(e){alert(e.message);}
 render();
 const box=document.getElementById("msgs");if(box)box.scrollTop=box.scrollHeight;}

/* ---------------- boot ---------------- */
async function enterApp(){
 await loadAll();
 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";
 state.comp=DATA[0]?DATA[0].id:null;
 state.open=new Set((DATA[0]?DATA[0].objectives:[]).map(o=>o.code));
 paintChrome();render();}

document.getElementById("btn-login").onclick=async()=>{
 const btn=document.getElementById("btn-login"),err=document.getElementById("lg-err");
 err.style.display="none";btn.disabled=true;
 try{
  const r=await api("/auth/login",{method:"POST",body:JSON.stringify({
    firmCode:document.getElementById("in-code").value.trim(),
    username:document.getElementById("in-user").value.trim(),
    password:document.getElementById("in-pass").value})});
  TOKEN=r.token;localStorage.setItem("isqm_token",TOKEN);
  await enterApp();
 }catch(e){err.textContent=e.message==="bad_credentials"?t("err"):e.message;err.style.display="block";}
 finally{btn.disabled=false;}};
document.getElementById("in-pass").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("btn-login").click();});
function showSignup(on){
 document.getElementById("login-card").style.display=on?"none":"block";
 document.getElementById("signup-card").style.display=on?"block":"none";}
document.getElementById("btn-signup").onclick=()=>showSignup(true);
document.getElementById("btn-back-login").onclick=()=>showSignup(false);
let SIGNUP_IDEM_KEY=null;
function newSignupAttempt(){
 SIGNUP_IDEM_KEY=(crypto.randomUUID?crypto.randomUUID():
  ("idm-"+Date.now()+"-"+Math.random().toString(16).slice(2)));}
document.getElementById("btn-signup").addEventListener("click",newSignupAttempt);
document.getElementById("btn-create").onclick=async()=>{
 const btn=document.getElementById("btn-create");
 if(btn.disabled)return;                       // منع أي نقرة إضافية أثناء التنفيذ
 const g=id=>document.getElementById(id).value.trim();
 const err=document.getElementById("su-err");err.style.display="none";
 const code=g("su-code"),firm=g("su-firm"),admin=g("su-admin"),user=g("su-user"),pass=g("su-pass"),pass2=g("su-pass2");
 if(!code||!firm||!admin||!user||!pass){err.textContent=t("reqFields");err.style.display="block";return;}
 if(!/^[A-Za-z0-9_-]{3,20}$/.test(code)){err.textContent=t("codeFormat");err.style.display="block";return;}
 if(pass!==pass2){err.textContent=t("passMismatch");err.style.display="block";return;}
 if(!SIGNUP_IDEM_KEY)newSignupAttempt();        // احتياطاً إن لم يُنشأ بعد
 btn.disabled=true;
 try{
  const r=await api("/auth/register",{method:"POST",body:JSON.stringify({
   firmCode:code,firmName:firm,cr:g("su-cr"),city:g("su-city"),adminName:admin,
   email:g("su-email"),username:user,password:pass,idemKey:SIGNUP_IDEM_KEY})});
  TOKEN=r.token;localStorage.setItem("isqm_token",TOKEN);
  await enterApp();
  setTimeout(()=>alert(t("accCreated")+" "+r.firmCode+"\n"+t("user")+": "+user),150);
 }catch(e){
  err.textContent=e.message==="firm_code_taken"?t("codeTaken"):e.message==="invalid_firm_code"?t("codeFormat"):e.message;
  err.style.display="block";
 }
 finally{btn.disabled=false;SIGNUP_IDEM_KEY=null;}};
document.getElementById("btn-lang-login").onclick=()=>setLang(lang==="ar"?"en":"ar");
document.getElementById("lg-ar").onclick=()=>setLang("ar");
document.getElementById("lg-en").onclick=()=>setLang("en");
document.getElementById("btn-print").onclick=()=>window.print();
document.getElementById("btn-logout").onclick=()=>{TOKEN=null;localStorage.removeItem("isqm_token");
 document.getElementById("app").style.display="none";
 document.getElementById("login").style.display="grid";
 DATA.length=0;CHAT.length=0;USERS.length=0;PEOPLE.length=0;ME=0;
 state={page:"home",comp:"all",sel:null,q:"",adding:false,addingObjective:false,addingUser:false,editingUserId:null,editingFirm:false,open:new Set(),navOpen:true,wTab:"details",cComp:"all",cNode:"all",relink:null,draft:""};};
paintLogin();
if(TOKEN){enterApp().catch(()=>{TOKEN=null;localStorage.removeItem("isqm_token");});}
</script>
